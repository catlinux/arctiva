---
# Con systemd y logind los grupos clásicos (audio, video, storage…) ya no hacen falta.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: false
autologinGroup: autologin

setRootPassword: true
# Misma contraseña para el administrador (root), marcada por defecto.
doReusePassword: true

displayAutologin: true
doAutologin: false

passwordRequirements:
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=8
        - minclass=0
# El usuario puede aceptar una contraseña débil marcando la casilla.
allowWeakPasswords: true
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "arctiva-${first}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false
