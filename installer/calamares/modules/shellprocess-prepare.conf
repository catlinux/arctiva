---
# Fuera del chroot: el script entra en él cuando hace falta.
dontChroot: true
# pacman-key --populate y pacman -R pueden tardar en un USB lento.
timeout: 600
verbose: true
script:
    - /usr/lib/arctiva-installer/prepare-target ${ROOT}

i18n:
    name: "Preparing the installed system"
    name[es]: "Preparando el sistema instalado"
    name[ca]: "Preparant el sistema instal·lat"
