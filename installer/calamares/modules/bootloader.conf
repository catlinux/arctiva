# SPDX-License-Identifier: GPL-3.0-or-later
---
efiBootLoader: grub

grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: grub-probe
efiBootMgr: efibootmgr

# EFI/arctiva en la ESP, junto a EFI/Microsoft o la de otra distribución.
efiBootloaderId: arctiva
# Copia en EFI/BOOT/BOOTX64.EFI para firmwares que pierden las entradas NVRAM. Windows
# arranca desde su propia entrada.
installEFIFallback: true
installHybridGRUB: false
