---
# Fuera del chroot: el script entra en él cuando hace falta.
dontChroot: true
# El valor por defecto (30 s) no basta para descargar el controlador de NVIDIA.
timeout: 1800
verbose: true
script:
    - /usr/lib/arctiva-installer/install-drivers ${ROOT}

i18n:
    name: "Installing graphics drivers"
    name[es]: "Instalando los controladores gráficos"
    name[ca]: "Instal·lant els controladors gràfics"
