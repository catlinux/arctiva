# Disco (D-04): solo UEFI/GPT, Btrfs, sin swap en disco (zram) y cifrado LUKS1 opcional.
---
efi:
    mountPoint: /boot/efi
    # Al crear una ESP nueva. La de 100 MiB de Windows también sirve: solo guarda GRUB.
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: EFI

userSwapChoices:
    - none
initialSwapChoice: none

# GRUB tiene que descifrar /boot (está dentro de @): LUKS1 con PBKDF2. Ver D-04.
luksGeneration: luks1
enableLuksAutomatedPartitioning: true
preCheckEncryption: false
showNotEncryptedBootMessage: true

# El usuario elige siempre: «Borrar disco» nunca está marcado de antemano.
initialPartitioningChoice: none

# El código de 3.4.3 lo lee aunque partition.schema.yaml no lo recoja.
defaultPartitionTableType: gpt
defaultFileSystemType: btrfs
# En los modos automáticos no se ofrece otro; el modo manual admite cualquiera.
availableFileSystemTypes: [ "btrfs" ]

drawNestedPartitions: false
alwaysShowPartitionLabels: true

lvm:
    enable: false

essentialMounts: [ "live-*", "control", "ventoy" ]
