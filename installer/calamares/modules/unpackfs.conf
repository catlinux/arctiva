---
# Capa inferior (de solo lectura) de la live: el squashfs ya montado por archiso. No se usa
# /run/archiso/bootmnt/arctiva/x86_64/airootfs.sfs porque con copytoram archiso desmonta el USB.
unpack:
    - source: /run/archiso/airootfs
      sourcefs: file
      destination: ""
      # Archivos exclusivos de la live (iso/airootfs/); si cambian allí, cambiarlos aquí.
      exclude:
          - /usr/local/bin/arctiva-live-setup
          - /etc/systemd/system/arctiva-live-setup.service
          - /etc/systemd/system/graphical.target.d/arctiva-live.conf
          - /etc/systemd/system/multi-user.target.d/arctiva-live.conf
          - /etc/systemd/system/etc-pacman.d-gnupg.mount
          - /etc/systemd/system/pacman-init.service
          - /etc/systemd/journald.conf.d/volatile-storage.conf
          - /etc/systemd/logind.conf.d/do-not-suspend.conf
          - /etc/plasmalogin.conf.d/arctiva-live.conf
          - /etc/mkinitcpio.conf.d/archiso.conf
