---
# Página QML propia en el branding (arctiva/keyboardq.qml); si falta, la de Calamares.
qmlSearch: both
xOrgConfFileName: /etc/X11/xorg.conf.d/00-keyboard.conf
convertedKeymapPath: /lib/kbd/keymaps/xkb
# Plasma (Wayland) lee la distribución de kxkbrc, no de la configuración de X11.
configure:
    kwin: true
