---
# Hooks clásicos (udev, encrypt): usan /crypto_keyfile.bin sin parámetros y son los que
# necesita grub-btrfs-overlayfs, que no funciona con el hook systemd (D-04).
useSystemdHook: false

hooks:
    # Arranque de instantáneas de solo lectura desde el menú de GRUB (grub-btrfs).
    append: [ grub-btrfs-overlayfs ]
    # Sin FONT en vconsole.conf solo produce un aviso.
    remove: [ consolefont ]

source: /etc/mkinitcpio.conf
