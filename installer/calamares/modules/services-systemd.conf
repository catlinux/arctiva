# zram no se habilita: zram-generator lee /etc/systemd/zram-generator.conf al arrancar.
---
units:
    - name: NetworkManager.service
      action: enable
      mandatory: true
    - name: plasmalogin.service
      action: enable
      mandatory: true
    - name: bluetooth.service
      action: enable
    - name: cups.socket
      action: enable
    # Regenera el menú de instantáneas de GRUB cuando Snapper crea o borra una.
    - name: grub-btrfsd.service
      action: enable
    # Limpieza de las instantáneas antiguas de snap-pac (algoritmo number).
    - name: snapper-cleanup.timer
      action: enable
