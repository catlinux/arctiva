# zram no se habilita: zram-generator lee su configuración (arctiva-settings) al arrancar.
---
units:
    - name: NetworkManager.service
      action: enable
      mandatory: true
    - name: plasmalogin.service
      action: enable
      mandatory: true
    - name: bluetooth.service
      action: enable
    # Perfiles de energía (ahorro, equilibrado, rendimiento) en la bandeja y en Ajustes de KDE.
    - name: power-profiles-daemon.service
      action: enable
    - name: cups.socket
      action: enable
    # Regenera el menú de instantáneas de GRUB cuando Snapper crea o borra una.
    - name: grub-btrfsd.service
      action: enable
    # Mirrors rápidos: lo instala arctiva-settings con su configuración.
    - name: reflector.timer
      action: enable
    # Limpieza de las instantáneas antiguas de snap-pac (algoritmo number).
    - name: snapper-cleanup.timer
      action: enable
