---
backend: pacman

# Sin red se instala solo lo que lleva la ISO. Con red se actualiza todo antes de instalar
# nada: nunca -Sy sin -Syu (D-07).
skip_if_no_internet: true
update_db: true
ignore_update_db_error: false
update_system: true

pacman:
    num_retries: 2
    disable_download_timeout: false
    needed_only: true

operations:
    # No va en la ISO por tamaño (D-14). Si falla, la instalación sigue con linux.
    - try_install:
        - linux-lts
    # Aplicaciones que no caben en la ISO (packages/arctiva-settings/files/usr/share/arctiva/deferred-packages;
    # una prueba comprueba que coinciden). Sin red, arctiva-deferred.service las instala en la primera conexión.
    - try_install:
        - kate
        - ark
        - okular
        - gwenview
        - spectacle
        - kwalletmanager
        - kdegraphics-thumbnailers
        - ffmpegthumbs
        # Herramientas de compilación (makepkg, gcc, make…) para el AUR y para compilar a mano.
        - base-devel
