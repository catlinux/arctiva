# Edita /etc/default/grub del sistema instalado. Calamares añade por su cuenta
# GRUB_ENABLE_CRYPTODISK y cryptdevice= cuando la raíz va cifrada.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "loglevel=3", "quiet" ]

# Se aplican aunque el archivo exista (lo trae el paquete grub).
always_use_defaults: true
defaults:
    GRUB_TIMEOUT: 5
    # El menú siempre visible, con el tema de Arctiva (prepare-target lo copia a /boot/grub/themes).
    GRUB_TIMEOUT_STYLE: menu
    GRUB_THEME: /boot/grub/themes/arctiva/theme.txt
    GRUB_GFXMODE: auto
    GRUB_DEFAULT: "0"
    # Sin esto, linux-lts queda primero en el menú (orden de versión) y arranca por defecto.
    GRUB_TOP_LEVEL: /boot/vmlinuz-linux
    # os-prober añade Windows al menú.
    GRUB_DISABLE_OS_PROBER: false
    # GRUB 2.16 (31_efi_bootnext) añade una entrada por cada opción del firmware: PXE, shell…
    GRUB_DISABLE_BOOTNEXT: true
