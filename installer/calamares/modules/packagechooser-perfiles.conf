# SPDX-License-Identifier: GPL-3.0-or-later
# Perfiles opcionales (D-03, D-11). Básico es lo que ya lleva la ISO y se instala siempre.
# Cada perfil se añade a la operación `install` de packages: un nombre inexistente o una descarga
# fallida rompe la instalación. Sin red, packages no hace nada (skip_if_no_internet).
---
mode: optionalmultiple
method: packages

labels:
    step: "Profiles"
    step[es]: "Perfiles"
    step[ca]: "Perfils"

items:
    - id: basico
      name: "Basic"
      name[es]: "Básico"
      name[ca]: "Bàsic"
      description: "Plasma desktop, Firefox, snapshots and everything needed to start. Always installed, with or without internet. Hold Ctrl and click to add Gaming or Office."
      description[es]: "Escritorio Plasma, Firefox, instantáneas y todo lo necesario para empezar. Se instala siempre, con o sin internet. Mantén Ctrl y haz clic para añadir Juegos u Oficina."
      description[ca]: "Escriptori Plasma, Firefox, instantànies i tot el necessari per començar. S'instal·la sempre, amb o sense internet. Mantén Ctrl i fes clic per afegir Jocs o Oficina."
      screenshot: "perfil-basico.svg"
      packages: []
    - id: juegos
      name: "Gaming"
      name[es]: "Juegos"
      name[ca]: "Jocs"
      description: "Steam, Lutris, GameMode, MangoHud and Gamescope, with 32-bit graphics libraries. Download of about 0.3 GB. Needs internet; offline only the Basic system is installed and you can add this later."
      description[es]: "Steam, Lutris, GameMode, MangoHud y Gamescope, con las bibliotecas gráficas de 32 bits. Descarga de unos 0,3 GB. Necesita internet; sin conexión se instala solo Básico y se puede añadir después."
      description[ca]: "Steam, Lutris, GameMode, MangoHud i Gamescope, amb les biblioteques gràfiques de 32 bits. Descàrrega d'uns 0,3 GB. Necessita internet; sense connexió s'instal·la només Bàsic i es pot afegir després."
      screenshot: "perfil-juegos.svg"
      packages:
        - steam
        - lutris
        - gamemode
        - lib32-gamemode
        - mangohud
        - lib32-mangohud
        - gamescope
        - lib32-mesa
        - lib32-vulkan-radeon
        - lib32-vulkan-intel
        - ttf-liberation
    - id: oficina
      name: "Office"
      name[es]: "Oficina"
      name[ca]: "Oficina"
      description: "LibreOffice and Thunderbird in English, Spanish and Catalan, with spell checkers, compatible fonts, scanner and printer support. Download of about 0.3 GB. Needs internet; offline only the Basic system is installed and you can add this later."
      description[es]: "LibreOffice y Thunderbird en inglés, castellano y catalán, con correctores, tipografías compatibles y compatibilidad con escáneres e impresoras. Descarga de unos 0,3 GB. Necesita internet; sin conexión se instala solo Básico y se puede añadir después."
      description[ca]: "LibreOffice i Thunderbird en anglès, castellà i català, amb correctors, tipografies compatibles i suport d'escàners i impressores. Descàrrega d'uns 0,3 GB. Necessita internet; sense connexió s'instal·la només Bàsic i es pot afegir després."
      screenshot: "perfil-oficina.svg"
      packages:
        - libreoffice-fresh
        - libreoffice-fresh-es
        - libreoffice-fresh-ca
        - hunspell-en_us
        - hunspell-es_es
        - hyphen-en
        - hyphen-es
        - mythes-en
        - mythes-es
        - ttf-carlito
        - ttf-caladea
        - ttf-liberation
        - thunderbird
        - thunderbird-i18n-es-es
        - thunderbird-i18n-ca
        - skanpage
        - sane-airscan
        - gutenprint
