# SPDX-License-Identifier: GPL-3.0-or-later
---
# Página QML propia en el branding (arctiva/welcomeq.qml); si falta, la de Calamares.
qmlSearch: both
showSupportUrl: true
showKnownIssuesUrl: false
showReleaseNotesUrl: true
showDonateUrl: false

requirements:
    # En GiB. Es también el mínimo que pide el particionado para «Junto a» y «Reemplazar».
    requiredStorage: 25
    requiredRam: 4.0
    # La misma comprobación que usa NetworkManager en Arch.
    internetCheckUrl: http://ping.archlinux.org/nm-check.txt
    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen
    # La red solo hace falta para linux-lts y los perfiles; sin ella se instala lo de la ISO.
    required:
        - storage
        - ram
        - root
