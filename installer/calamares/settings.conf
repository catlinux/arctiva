# Secuencia del instalador de Arctiva (D-03, D-04). Páginas de widgets hasta tener las QML.
---
modules-search: [ local ]

instances:
    - id: prepare
      module: shellprocess
      config: shellprocess-prepare.conf
    - id: finish
      module: shellprocess
      config: shellprocess-finish.conf
    - id: comprobacion
      module: notesqml
      config: notesqml-comprobacion.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        # Justo antes del disco: Windows hibernado, BitLocker, batería y red.
        - notesqml@comprobacion
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        # Antes de initcpiocfg: el archivo de clave tiene que existir para que entre en FILES.
        - luksbootkeyfile
        - initcpiocfg
        - shellprocess@prepare
        - packages
        - initcpio
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - grubcfg
        - bootloader
        # Al final: la instantánea inicial contiene ya el sistema completo y el GRUB configurado.
        - shellprocess@finish
        - umount
    - show:
        - finished

branding: arctiva
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
