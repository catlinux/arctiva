# Secuencia del instalador de Arctiva (D-03, D-04). Páginas QML propias (branding/arctiva/*q.qml) salvo el disco, que es de widgets.
---
modules-search: [ local ]

instances:
    - id: prepare
      module: shellprocess
      config: shellprocess-prepare.conf
    - id: finish
      module: shellprocess
      config: shellprocess-finish.conf
    - id: drivers
      module: shellprocess
      config: shellprocess-drivers.conf
    - id: perfiles
      module: packagechooser
      config: packagechooser-perfiles.conf
    - id: comprobacion
      module: notesqml
      config: notesqml-comprobacion.conf

sequence:
    - show:
        - welcomeq
        - localeq
        - keyboardq
        - packagechooser@perfiles
        # Justo antes del disco: Windows hibernado, BitLocker, batería y red.
        - notesqml@comprobacion
        - partition
        - usersq
        - summaryq
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - localeq
        - keyboardq
        - localecfg
        # Antes de initcpiocfg: el archivo de clave tiene que existir para que entre en FILES.
        - luksbootkeyfile
        - initcpiocfg
        - shellprocess@prepare
        - packages
        # Antes de initcpio: el initramfs se genera ya con los módulos de NVIDIA.
        - shellprocess@drivers
        - initcpio
        - usersq
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - grubcfg
        - bootloader
        # Al final: la instantánea inicial contiene ya el sistema completo y el GRUB configurado.
        - shellprocess@finish
        - umount
    - show:
        - finishedq

branding: arctiva
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
