# Plymouth justo después de udev (lo pide su hook). No se toca el initramfs de la live
# (hook archiso) ni se duplica si ya está.
if [[ " ${HOOKS[*]} " != *" archiso "* && " ${HOOKS[*]} " != *" plymouth "* ]]; then
    _arctiva_hooks=()
    for _arctiva_h in "${HOOKS[@]}"; do
        _arctiva_hooks+=("$_arctiva_h")
        [[ $_arctiva_h == udev ]] && _arctiva_hooks+=(plymouth)
    done
    HOOKS=("${_arctiva_hooks[@]}")
    unset _arctiva_hooks _arctiva_h
fi
