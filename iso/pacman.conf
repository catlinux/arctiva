#
# pacman.conf usado solo para construir la ISO.
# build.sh sustituye las líneas «Include» por el servidor del Arch Linux Archive
# de la fecha fijada (D-02); con «-d latest» se usan los mirrors del equipo.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Solo en la ISO, para no pasar de 1,9 GiB (D-14); el sistema instalado
# recupera la documentación al actualizar cada paquete.
NoExtract   = usr/share/doc/* usr/share/gtk-doc/*

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
