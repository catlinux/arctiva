name: Bug report
description: Something in Arctiva doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For questions or help, please use Discussions. Use this form for problems that look like a bug.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arctiva version
      description: The version or ISO you use, if you know it.
  - type: textarea
    id: hardware
    attributes:
      label: Hardware
      description: Computer model, processor and graphics card.
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      render: shell
