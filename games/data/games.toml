# Recetas propias de Arctiva Games (D-G9): mismo formato que los scripts de instalación de Lutris,
# escritas a mano. `runners` es la lista de preferencia de ejecutores (nombre de carpeta de Proton o «wine»). Sirven sin lutris.net. Las URL son las descargas oficiales de cada lanzador.
# Sin probar aún en un equipo real: ver TODO.
version = 1

[[recipe]]
slug = "battlenet"
name = "Battle.net"
description = "Lanzador de Blizzard"
runners = ["Proton-Wineland", "GE-Proton", "UMU-Proton", "wine"]
script = '''
name: Battle.net
slug: battlenet
runner: wine
user: Arctiva
script:
  files:
    - setup:
        url: "https://www.battle.net/download/getInstallerForGame?os=win&gameProgram=BATTLENET_APP&version=Live"
        filename: Battle.net-Setup.exe
  game:
    exe: $WINEPREFIX/drive_c/Program Files (x86)/Battle.net/Battle.net Launcher.exe
    arch: win64
  system:
    env:
      WINE_SIMULATE_WRITECOPY: "1"
  installer:
    - task:
        name: create_prefix
        arch: win64
    - task:
        name: wineexec
        executable: setup
        args: --installpath="C:\\Program Files (x86)\\Battle.net" --lang=enUS
        description: Instalar Battle.net e iniciar sesión
        wait: user
        wait_message: "Antes de iniciar sesión, elige tu región en la pantalla de inicio (el icono del globo o el engranaje: Europa, Américas o Asia); si no, Battle.net no verá tus horas de juego. Cuando hayas terminado, pulsa Continuar. El lanzador no se cierra."
'''

[[recipe]]
slug = "ea-app"
name = "EA app"
description = "Lanzador de Electronic Arts"
runners = ["Proton-Wineland", "GE-Proton", "UMU-Proton", "wine"]
script = '''
name: EA app
slug: ea-app
runner: wine
user: Arctiva
script:
  files:
    - setup: "https://origin-a.akamaihd.net/EA-Desktop-Client-Download/installer-releases/EAappInstaller.exe"
  game:
    exe: $WINEPREFIX/drive_c/Program Files/Electronic Arts/EA Desktop/EA Desktop/EADesktop.exe
    arch: win64
  installer:
    - task:
        name: create_prefix
        arch: win64
    - task:
        name: winetricks
        app: corefonts win10
        description: Instalar fuentes y ajustar la versión de Windows
    - task:
        name: wineexec
        executable: setup
        args: /S
        return_code: "0,3"
        description: Instalar la EA app
'''

